<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="210" viewBox="0 0 1280 210" role="img" aria-labelledby="t d">
  <title id="t">Core values</title>
  <desc id="d">Reliability over flash; Simple and self-hostable; Product-first.</desc>
  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <g transform="translate(0 0)">
      <rect width="411" height="210" rx="14" fill="#0c114a"/>
      <rect x="28" y="30" width="36" height="4" rx="2" fill="#524dd3"/>
      <text x="28" y="60" fill="#9a99c4" font-size="14" font-weight="600" letter-spacing="3">01</text>
      <text x="28" y="98" fill="#ffffff" font-size="24" font-weight="700">Reliability over flash</text>
      <text x="28" y="134" fill="#d4d3ef" font-size="16">Dependable systems first. We</text>
      <text x="28" y="158" fill="#d4d3ef" font-size="16">choose proven patterns that</text>
      <text x="28" y="182" fill="#d4d3ef" font-size="16">scale gradually and predictably.</text>
    </g>
    <g transform="translate(435 0)">
      <rect width="411" height="210" rx="14" fill="#0c114a"/>
      <rect x="28" y="30" width="36" height="4" rx="2" fill="#8dd7bf"/>
      <text x="28" y="60" fill="#9a99c4" font-size="14" font-weight="600" letter-spacing="3">02</text>
      <text x="28" y="98" fill="#ffffff" font-size="24" font-weight="700">Simple and self-hostable</text>
      <text x="28" y="134" fill="#d4d3ef" font-size="16">Keep things simple, observable</text>
      <text x="28" y="158" fill="#d4d3ef" font-size="16">and self-hostable where it</text>
      <text x="28" y="182" fill="#d4d3ef" font-size="16">matters to you.</text>
    </g>
    <g transform="translate(869 0)">
      <rect width="411" height="210" rx="14" fill="#0c114a"/>
      <rect x="28" y="30" width="36" height="4" rx="2" fill="#524dd3"/>
      <text x="28" y="60" fill="#9a99c4" font-size="14" font-weight="600" letter-spacing="3">03</text>
      <text x="28" y="98" fill="#ffffff" font-size="24" font-weight="700">Product-first</text>
      <text x="28" y="134" fill="#d4d3ef" font-size="16">Ship small, iterate fast and</text>
      <text x="28" y="158" fill="#d4d3ef" font-size="16">let real usage guide what</text>
      <text x="28" y="182" fill="#d4d3ef" font-size="16">we build next.</text>
    </g>
  </g>
</svg>
